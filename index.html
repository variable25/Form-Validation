<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Form-Validation Page</title>
</head>
<body>
    <div class="form-card">
        <h1 class="form-header">Form Data</h1>
        <div class="form-field">
            <label for="Name" class="label-text">Name:</label>
            <input type="Name" class="form-input" placeholder="Enter your Name here">
            <span id="name-error"></span>
        </div>
        <div class="form-field">
            <label for="Name" class="label-text">Email:</label>
            <input type="Name" class="form-input" placeholder="Enter your Email here" type="email">
            <span id="email-error"></span>
        </div>
        <div class="form-field">
            <label for="Name" class="label-text">Phone No:</label>
            <input type="Name" class="form-input" placeholder="Enter your Phone Number here" type="number">
            <span id="phone-error"></span>
        </div>
        <button>Submit</button>
        <span id="submit-error"></span>

    </div>


    <script src="app.js"></script>
</body>
</html>
